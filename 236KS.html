    <!-- Script tích hợp Supabase cho 36-TTB236 -->
    <script>
        const SUPABASE_URL = 'https://hbebizzldisahoonbrtn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Ob78HELQ_uFN2VvIRjPWig_2ZfUpYGL';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const TU_LUU_TRU_ID = '36-TTB236';
        const totalNgan = 12;
        const totalRows = 4;
        let inventory = {};

        function addDays(dateStr, days) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            date.setDate(date.getDate() + days);
            return date.toISOString().split('T')[0];
        }

        function formatDateDisplay(dateStr) {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
            return dateStr;
        }

        // Kiểm tra hạn sử dụng dưới 20 ngày
        function isExpiringSoon(hanSuDungStr) {
            if (!hanSuDungStr) return false;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const expDate = new Date(hanSuDungStr);
            expDate.setHours(0, 0, 0, 0);
            const diffTime = expDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            return diffDays >= 0 && diffDays <= 20;
        }

        function initInventory() {
            let temp = {};
            for (let i = 1; i <= totalNgan; i++) {
                temp[i] = {
                    rows: {
                        1: { barcodeKhay: '', items: [] },
                        2: { barcodeKhay: '', items: [] },
                        3: { barcodeKhay: '', items: [] },
                        4: { barcodeKhay: '', items: [] }
                    }
                };
            }
            return temp;
        }
        inventory = initInventory();

        const selectNgan = document.getElementById('selectNgan');
        function populateNganSelects() {
            selectNgan.innerHTML = '';
            for (let i = 1; i <= totalNgan; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `NGĂN ${i}`;
                selectNgan.appendChild(opt);
            }
        }
        populateNganSelects();

        function updateSyncStatus(msg, isError = false) {
            const el = document.getElementById('syncStatus');
            if (el) {
                el.textContent = msg;
                el.style.color = isError ? '#ffcdd2' : '#ffffff';
            }
        }

        async function loadDataFromSupabase() {
            updateSyncStatus('🟡 Đang tải dữ liệu từ Supabase...');
            const { data, error } = await _supabase
                .from('blood_units')
                .select('*')
                .eq('tu_luu_tru', TU_LUU_TRU_ID)
                .eq('status', 'available');

            if (error) {
                console.error("Lỗi tải Supabase:", error);
                updateSyncStatus('🔴 Lỗi kết nối Supabase', true);
                return;
            }

            inventory = initInventory();

            data.forEach(row => {
                const nganMatch = String(row.ngan || "").match(/\d+/);
                const hangMatch = String(row.hang_khay || "").match(/\d+/);

                if (nganMatch && hangMatch) {
                    const nganId = parseInt(nganMatch[0], 10);
                    const hangId = parseInt(hangMatch[0], 10);

                    if (inventory[nganId] && inventory[nganId].rows[hangId]) {
                        inventory[nganId].rows[hangId].barcodeKhay = row.barcode_khay || '';
                        inventory[nganId].rows[hangId].items.push({
                            id: row.id,
                            barcode: row.barcode_tui_mau,
                            nhom: row.nhom_mau || 'O',
                            rh: row.yeu_to_rh || 'Rh+',
                            dungTich: row.dung_tich || 250,
                            ngayNhap: row.ngay_nhap || new Date().toISOString().split('T')[0],
                            hanSuDung: row.han_su_dung || addDays(new Date().toISOString().split('T')[0], 42)
                        });
                    }
                }
            });

            renderView();
            updateSyncStatus('🟢 Đã đồng bộ với Supabase');
        }

        const realtimeChannel = _supabase
            .channel('public:blood_units_236')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'blood_units' }, (payload) => {
                loadDataFromSupabase();
            })
            .subscribe();

        // Thêm nhanh mã Barcode vào kho: Tự động lấy thông tin sẵn có từ Supabase nếu túi máu đã tồn tại
        document.getElementById('addBloodForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const nganId = document.getElementById('selectNgan').value;
            const hangId = document.getElementById('selectHang').value;
            const barcodeKhay = document.getElementById('barcodeKhay').value.trim();
            const barcodeTui = document.getElementById('barcodeTui').value.trim();
            
            if (!barcodeTui) return;

            updateSyncStatus('🟡 Đang tra cứu thông tin túi máu...');

            let nhomMau = 'O';
            let yeuToRh = 'Rh+';
            let dungTich = 250;
            let hanSuDung = addDays(new Date().toISOString().split('T')[0], 42);

            const { data: existingBags, error: searchError } = await _supabase
                .from('blood_units')
                .select('*')
                .eq('barcode_tui_mau', barcodeTui)
                .limit(1);

            if (!searchError && existingBags && existingBags.length > 0) {
                const bagInfo = existingBags[0];
                nhomMau = bagInfo.nhom_mau || 'O';
                yeuToRh = bagInfo.yeu_to_rh || 'Rh+';
                dungTich = bagInfo.dung_tich || 250;
                hanSuDung = bagInfo.han_su_dung || hanSuDung;
            }

            const today = new Date().toISOString().split('T')[0];

            updateSyncStatus('🟡 Đang lưu vào Supabase...');

            const { error } = await _supabase
                .from('blood_units')
                .upsert([
                    {
                        tu_luu_tru: TU_LUU_TRU_ID,
                        ngan: `NGĂN ${nganId}`,
                        hang_khay: `HÀNG ${hangId}`,
                        barcode_khay: barcodeKhay,
                        barcode_tui_mau: barcodeTui,
                        nhom_mau: nhomMau,
                        yeu_to_rh: yeuToRh,
                        dung_tich: dungTich,
                        ngay_nhap: today,
                        han_su_dung: hanSuDung,
                        status: 'available'
                    }
                ], { onConflict: 'barcode_tui_mau' });

            if (error) {
                alert('Lỗi khi lưu vào Supabase: ' + error.message);
                updateSyncStatus('🔴 Lỗi lưu dữ liệu', true);
                return;
            }

            document.getElementById('barcodeTui').value = '';
            document.getElementById('barcodeTui').focus();
            loadDataFromSupabase();
        });

        // Hàm ghi log lịch sử xuất kho và chuyển trạng thái thành 'exported' (đã xuất) thay vì xóa hẳn
        async function checkoutItemAndLog(item) {
            await _supabase.from('checkout_logs').insert([{
                tu_luu_tru: TU_LUU_TRU_ID,
                barcode_tui_mau: item.barcode,
                nhom_mau: item.nhom,
                yeu_to_rh: item.rh,
                dung_tich: item.dungTich,
                han_su_dung: item.hanSuDung
            }]);

            if (item.id) {
                await _supabase.from('blood_units').update({ status: 'exported' }).eq('id', item.id);
            }
        }

        // Xuất từng túi máu đơn lẻ
        window.checkoutSingleItem = async function(nganId, hangId, index) {
            const item = inventory[nganId].rows[hangId].items[index];
            if (confirm(`Xác nhận xuất túi máu [${item.barcode}] ra khỏi kho?`)) {
                await checkoutItemAndLog(item);
                loadDataFromSupabase();
                alert(`✅ Đã xuất túi máu ${item.barcode} và cập nhật trạng thái thành công!`);
            }
        }

        // Xóa hẳn từng túi máu đơn lẻ khỏi cơ sở dữ liệu
        window.deleteSingleItem = async function(nganId, hangId, index) {
            const item = inventory[nganId].rows[hangId].items[index];
            if (confirm(`⚠️ XÁC NHẬ
